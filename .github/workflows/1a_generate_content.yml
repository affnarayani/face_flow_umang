name: 1A. Generate Content

on:
  schedule:
    - cron: '9 19 * * *'
    - cron: '44 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

        sudo apt-get update && sudo apt-get install -y cloudflare-warp

        sudo systemctl start warp-svc
        sleep 2

        warp-cli --accept-tos registration new || warp-cli registration new
        warp-cli --accept-tos mode warp || warp-cli mode warp
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5

        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_content.py

    - name: Upload Error Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore

    - name: Commit and Push Changes
      run: |
        git add json/post.json json/umang_fb_topics.json json/config.json locators/ locators/changed_locators.json

        if git diff --staged --quiet; then
          echo "[INFO] No changes detected in post.json or topics list. Skipping push."
        else
          echo "[OK] State changes detected. Committing and pushing updates..."
          git commit -m "Automated: Update content tracking state [skip ci]"
          git pull origin ${GITHUB_REF_NAME} --rebase
          git push origin ${GITHUB_REF_NAME}
        fi
